[env:featheresp32]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
lib_deps = 
	bogde/HX711@^0.7.5
	waspinator/AccelStepper@^1.64
	links2004/WebSockets@^2.7.3
monitor_speed = 115200
